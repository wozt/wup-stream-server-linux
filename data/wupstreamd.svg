<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2b4a"/>
      <stop offset="1" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4f6f"/>
      <stop offset="1" stop-color="#26334a"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- signal waves -->
  <g fill="none" stroke="#5ec8ff" stroke-width="5" stroke-linecap="round">
    <path d="M96 44 a14 14 0 0 1 0 20" opacity=".45"/>
    <path d="M102 36 a24 24 0 0 1 0 36" opacity=".7"/>
    <path d="M108 28 a34 34 0 0 1 0 52" opacity=".95"/>
  </g>
  <circle cx="93" cy="54" r="4" fill="#5ec8ff"/>
  <!-- gamepad body -->
  <path d="M34 52 h60 a10 10 0 0 1 10 10 v8 a10 10 0 0 1 -10 10 h-8 l-4 10 a6 6 0 0 1 -11 1 l-7 -11 h-14 l-7 11 a6 6 0 0 1 -11 -1 l-4 -10 h-8 a10 10 0 0 1 -10 -10 v-8 a10 10 0 0 1 10 -10 z" fill="url(#body)"/>
  <!-- dpad -->
  <g fill="#dfe8f5">
    <rect x="40" y="62" width="6" height="18" rx="2"/>
    <rect x="34" y="68" width="18" height="6" rx="2"/>
  </g>
  <!-- face buttons -->
  <g>
    <circle cx="86" cy="60" r="4" fill="#e5484d"/>
    <circle cx="94" cy="68" r="4" fill="#46a758"/>
    <circle cx="78" cy="68" r="4" fill="#3e8ef7"/>
    <circle cx="86" cy="76" r="4" fill="#f5c542"/>
  </g>
  <!-- sticks -->
  <circle cx="52" cy="80" r="7" fill="#141c2c" stroke="#8fa3c0" stroke-width="2"/>
  <circle cx="102" cy="80" r="7" fill="#141c2c" stroke="#8fa3c0" stroke-width="2"/>
</svg>
